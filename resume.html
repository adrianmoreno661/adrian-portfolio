
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="View Adrian Moreno's mechanical engineering resume, skills, and experience.">
    <meta name="theme-color" content="#161617">

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <title>Adrian Moreno | Resume</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="resume.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container nav-container">

            <a href="index.html" class="logo" style="text-decoration: none;">
                AM.
            </a>

            <input
                type="checkbox"
                id="menu-toggle"
                class="menu-toggle"
                aria-label="Toggle navigation menu"
                aria-controls="primary-navigation"
            >

            <label for="menu-toggle" class="burger-label">
                Menu
            </label>

            <nav class="nav-links" id="primary-navigation" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="resume.html" class="active" aria-current="page">Resume</a>
                <a href="contact.html">Contact Me!</a>
            </nav>

        </div>
    </header>


    <!-- MAIN RESUME CONTENT -->
    <main class="resume-wrapper">

        <!-- TOP SPLIT HEADER -->
        <section class="container resume-hero">

            <div class="resume-hero-left">
                <h1 class="name">Adrian Moreno</h1>

                <p class="job">
                    Mechanical Engineering Student
                </p>

                <a
                    href="assets/Adrian_Moreno_Resume.pdf"
                    download
                    class="cta-btn"
                >
                    Download Resume <span class="arrow">↓</span>
                </a>
            </div>

            <div class="resume-hero-right">
                <img
                    src="assets/resume-photo.jpg"
                    alt="Portrait of Adrian Moreno"
                    class="resume-photo"
                >
            </div>

        </section>


        <!-- WHAT I CAN DO -->
        <section class="container capabilities-section">

            <h2 class="section-heading">
                What I Can Do
            </h2>

            <div class="bubbles-container" id="skills-container">
                <!-- Skills load automatically from Firestore -->
            </div>

        </section>


        <!-- SLIDING TIMELINE -->
        <section class="marquee-section">

            <div class="marquee-window">
                <div class="marquee-track" id="timeline-track">
                    <!-- Timeline cards load automatically from Firestore -->
                </div>
            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script type="module" src="resume.js"></script>

</body>
</html>
